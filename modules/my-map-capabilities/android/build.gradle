plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.mymapcapabilities'
expoModule { canBePublished = false }
version = '1.0.0'
android {
  namespace 'expo.modules.mymapcapabilities'
  buildFeatures { buildConfig true }
  defaultConfig { versionCode 1; versionName '1.0.0' }
  flavorDimensions 'distribution'
  productFlavors {
    google { dimension 'distribution';buildConfigField 'boolean','NANO_ENABLED','true' }
    amazon { dimension 'distribution';buildConfigField 'boolean','NANO_ENABLED','false' }
  }
}
dependencies {
  testImplementation 'junit:junit:4.13.2'
  implementation 'androidx.biometric:biometric:1.1.0'
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'com.google.mlkit:image-labeling:17.0.9'
  googleImplementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
