name: Build MyMap Beta APK

on:
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/build-beta-apk.yml'
  workflow_dispatch:

concurrency:
  group: mymap-beta-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: '--max_old_space_size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build release APK (ARM64 beta)
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Prepare beta artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/MyMap-0.6.1-beta-arm64.apk
          sha256sum dist/MyMap-0.6.1-beta-arm64.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMap-0.6.1-beta-arm64-apk
          path: |
            dist/MyMap-0.6.1-beta-arm64.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
