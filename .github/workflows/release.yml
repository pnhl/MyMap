name: Three-store release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build all store artifacts from this commit
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/maplibre-privacy-patch.cjs
      - run: node scripts/check-source-secrets.cjs
      - run: npm run check:public-config
      - name: Check Worker without production credentials
        run: |
          npm ci --ignore-scripts --prefix cloudflare/geo-gateway
          npm run check --prefix cloudflare/geo-gateway
      - run: node scripts/release-check.cjs --source-only
      - run: npm run lint
      - run: npm run typecheck
      - name: Generate native configuration fixtures for existing tests
        env:
          MYMAP_STORE: play
          MYMAP_RELEASE: 'false'
          EAS_BUILD: 'true'
        run: |
          node scripts/prepare-native-test-config.cjs
          npx expo prebuild --platform android --no-install
      - run: npm test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Export credential-free Android and iOS Hermes bundles
        env:
          MYMAP_STORE: play
          APP_STORE_TARGET: play
          MYMAP_RELEASE: 'false'
          EXPO_NO_DOTENV: '1'
          EAS_BUILD: 'false'
          EXPO_PUBLIC_ROUTING_GATEWAY_URL: https://gateway.example.test
          EXPO_PUBLIC_CESIUM_TERRAIN_ENABLED: 'true'
        run: npx expo export --platform android --platform ios --output-dir .local/provider-check
      - name: Scan exported bundles and all packaged resources for provider credentials
        run: python3 scripts/scan-provider-secrets.py .local/provider-check
  native-fixtures:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: play
            flavor: Google
          - store: amazon
            flavor: Amazon
    env:
      APP_STORE_TARGET: ${{ matrix.store }}
      MYMAP_STORE: ${{ matrix.store }}
      MYMAP_RELEASE: 'false'
      EXPO_NO_DOTENV: '1'
      EAS_BUILD: 'false'
      RNLLAMA_SKIP_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --ignore-scripts
      - run: npm run prepare:android
      - run: node scripts/prepare-parity-workspace.cjs "${{ matrix.store }}"
      - name: Compile without signing and test native missing-GMS boundary
        run: |
          FIXTURE=$(node -p "JSON.parse(require('fs').readFileSync('.local/parity-workspace.json')).directory")
          "$FIXTURE/android/gradlew" -p "$FIXTURE/android" :my-map-capabilities:test${{ matrix.flavor }}ReleaseUnitTest :app:process${{ matrix.flavor }}ReleaseMainManifest :app:compile${{ matrix.flavor }}ReleaseKotlin -PreactNativeArchitectures=arm64-v8a --dependency-verification=strict --max-workers=2
          node scripts/verify-native-fixture.cjs "${{ matrix.store }}"
          if [ "${{ matrix.store }}" = play ]; then
            "$FIXTURE/android/gradlew" -p "$FIXTURE/companions/wear" compileReleaseKotlin --dependency-verification=strict --max-workers=2
          fi
  android:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    needs: [checks, native-fixtures]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [play, amazon]
    env:
      MYMAP_STORE: ${{ matrix.store }}
      APP_STORE_TARGET: ${{ matrix.store }}
      MYMAP_RELEASE: 'true'
      EXPO_PUBLIC_ENABLE_TEST_ADS: 'false'
      RNLLAMA_SKIP_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --ignore-scripts
      - name: Restore private build configuration
        env:
          FIREBASE_ANDROID_BASE64: ${{ secrets.FIREBASE_ANDROID_BASE64 }}
          MYMAP_PUBLIC_ENV: ${{ secrets.MYMAP_PUBLIC_ENV }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', matrix.store == 'amazon' && 'AMAZON' || 'ANDROID')] }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', matrix.store == 'amazon' && 'AMAZON' || 'ANDROID')] }}
          ANDROID_KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', matrix.store == 'amazon' && 'AMAZON' || 'ANDROID')] }}
          ANDROID_KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', matrix.store == 'amazon' && 'AMAZON' || 'ANDROID')] }}
        run: node scripts/restore-ci-config.cjs android
      - run: npm run prepare:android
      - run: npx expo prebuild --platform android --no-install
      - run: node scripts/native-locks.cjs restore android
      - name: Compile signed releases
        working-directory: android
        run: |
          if [ "$MYMAP_STORE" = play ]; then
            ./gradlew :app:assembleGoogleRelease :app:bundleGoogleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true --max-workers=2
            ./gradlew -p ../companions/wear assembleRelease bundleRelease --max-workers=2
          else
            ./gradlew :app:assembleAmazonRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true --max-workers=2
          fi
      - name: Verify artifacts
        run: |
          mkdir -p dist/releases
          node scripts/release-inputs.cjs .local/release-inputs.json
          if [ "$MYMAP_STORE" = play ]; then
            cp android/app/build/outputs/apk/google/release/*.apk dist/releases/play.apk
            cp android/app/build/outputs/bundle/googleRelease/*.aab dist/releases/play.aab
            cp companions/wear/build/outputs/apk/release/*.apk dist/releases/wear.apk
            cp companions/wear/build/outputs/bundle/release/*.aab dist/releases/wear.aab
            python3 scripts/scan-provider-secrets.py android/app/build/generated/assets/react/googleRelease dist/releases/play.apk dist/releases/play.aab dist/releases/wear.apk dist/releases/wear.aab
            node scripts/write-artifact-provenance.cjs dist/releases/play.apk dist/releases/play.aab
            python3 scripts/verify-artifacts.py --play dist/releases/play.apk --wear dist/releases/wear.apk --commit "$GITHUB_SHA"
          else
            cp android/app/build/outputs/apk/amazon/release/*.apk dist/releases/amazon.apk
            python3 scripts/scan-provider-secrets.py android/app/build/generated/assets/react/amazonRelease dist/releases/amazon.apk
            node scripts/write-artifact-provenance.cjs dist/releases/amazon.apk
            python3 scripts/verify-artifacts.py --amazon dist/releases/amazon.apk --commit "$GITHUB_SHA"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.store }}
          path: dist/releases/
          if-no-files-found: error
  ios-unsigned:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    needs: checks
    runs-on: macos-26
    env:
      MYMAP_STORE: ios
      MYMAP_RELEASE: 'true'
      EXPO_PUBLIC_ENABLE_TEST_ADS: 'false'
      RNLLAMA_SKIP_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore private iOS configuration
        env:
          FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
          MYMAP_PUBLIC_ENV: ${{ secrets.MYMAP_PUBLIC_ENV }}
        run: node scripts/restore-ci-config.cjs ios
      - name: Select pinned Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - run: bash scripts/build-ios-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/releases/
          if-no-files-found: error
  ios-store:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    needs: checks
    runs-on: macos-26
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore private iOS configuration
        env:
          FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
          MYMAP_PUBLIC_ENV: ${{ secrets.MYMAP_PUBLIC_ENV }}
        run: node scripts/restore-ci-config.cjs ios
      - name: Build signed iOS through EAS
        run: npx --no-install eas build --platform ios --profile ios-store --non-interactive --wait --json > eas-result.json
      - run: node scripts/download-eas-artifact.cjs eas-result.json dist/releases/ios-signed.ipa
      - run: python3 scripts/verify-artifacts.py --ios dist/releases/ios-signed.ipa --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-signed
          path: dist/releases/
          if-no-files-found: error
  parity:
    needs: [android, ios-store, ios-unsigned]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Restore bundletool (pinned checksum in configuration)
        run: python3 scripts/fetch-bundletool.py
      - name: Compare all release artifacts from this commit
        env:
          BUNDLETOOL_JAR: .local/bundletool.jar
        run: python3 scripts/verify-artifacts.py --ios artifacts/ios-signed/ios-signed.ipa --play artifacts/play/play.apk --amazon artifacts/amazon/amazon.apk --aab artifacts/play/play.aab --ios-unsigned artifacts/ios-unsigned/MyMap-ios-unsigned.ipa --commit "$GITHUB_SHA" --complete
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Assemble five-artifact release manifest
        run: |
          node -e "require('fs').writeFileSync('.local/release-map.json',JSON.stringify({ios:'artifacts/ios-signed/ios-signed.ipa','ios-unsigned':'artifacts/ios-unsigned/MyMap-ios-unsigned.ipa',aab:'artifacts/play/play.aab',play:'artifacts/play/play.apk',amazon:'artifacts/amazon/amazon.apk'}))"
          node scripts/assemble-release-set.cjs .local/release-map.json dist/releases/release-set.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: dist/releases/*.json
